packages:
  - packages/*

allowBuilds:
  # Telemetry postinstall script pulled in by @asyncapi/parser. It is not needed to build or test.
  "@scarf/scarf": false
  esbuild: true

# Exact stable releases explicitly selected for the compiler security upgrade.
minimumReleaseAgeExclude:
  - "@typespec/asset-emitter@0.79.2"
  - "@typespec/compiler@1.16.0"
  - "@typespec/http@1.16.0"
  - "@typespec/openapi3@1.16.0"
  - "@typespec/openapi@1.16.0"
  - "@typespec/protobuf@0.86.0"

overrides:
  # Compatible Ajv URI patch for GHSA-5jgf-p345-68v8 and related advisories.
  fast-uri: "3.1.6"
  # DoS in qs.stringify, reached through @stryker-mutator/core. A patch
  # release inside the range its parent already asks for.
  qs: ">=6.15.2"
  # The three vite advisories are fixed from 6.4.3, and `vitepress@1.6.4`
  # asks for `vite ^5.4.14`. Forcing 6.4.3 does clear the audit, and it
  # breaks `pnpm docs:build`: vitepress 1.x builds on Rollup, and vite from
  # 6 uses Rolldown, which rejects the plugin it relies on. They stay
  # reported rather than fixed until vitepress ships a release that takes a
  # patched vite. All three are development-only and none reaches a
  # consumer of the published package.
