openapi: 3.1.0
info:
  title: Order Gateway HTTP
  version: 1.0.0
tags: []
paths:
  /order-submissions/{commandId}:
    get:
      operationId: getSubmission
      parameters:
        - name: commandId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionStatus'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /orders:
    post:
      operationId: submitOrder
      description: 202 records submission intent, not successful order processing or fulfillment.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: The request has been accepted for processing, but processing has not yet completed.
          headers:
            Location:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionReceipt'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Orders.Domain.Order'
  /orders/{orderId}:
    get:
      operationId: getOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Orders.Domain.Order'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
security:
  - BearerAuth: []
components:
  schemas:
    Orders.Domain.Order:
      type: object
      required:
        - orderId
        - customerId
        - items
      properties:
        orderId:
          type: string
          format: uuid
        customerId:
          type: string
          minLength: 1
        items:
          type: array
          items:
            $ref: '#/components/schemas/Orders.Domain.OrderLine'
          minItems: 1
      description: 'Shared business data: no HTTP, AsyncAPI, or Service Bus annotations.'
    Orders.Domain.OrderLine:
      type: object
      required:
        - sku
        - quantity
      properties:
        sku:
          type: string
          minLength: 1
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
    Problem:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    SubmissionReceipt:
      type: object
      required:
        - commandId
        - orderId
        - state
      properties:
        commandId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        state:
          type: string
          enum:
            - pending
    SubmissionStatus:
      type: object
      required:
        - commandId
        - orderId
        - state
      properties:
        commandId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        state:
          type: string
          enum:
            - pending
            - accepted
            - rejected
        reason:
          type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: Bearer
servers:
  - url: https://orders.example.invalid
    description: Inert public placeholder; bearer audience and identity are external configuration.
    variables: {}
